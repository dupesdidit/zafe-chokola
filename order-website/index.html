<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order a website · Sherwinn E Brice</title><meta name="description" content="Tell Sherwinn E Brice about the website you need."><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/styles.css">
<style>.ow{max-width:680px;margin:0 auto;padding:clamp(2rem,6vw,4.5rem) 1.25rem}.ow h1{margin:.5rem 0 .75rem}.ow .lede{opacity:.8;margin-bottom:2rem}.ow label{display:block;margin:0 0 1.1rem;font-weight:600}.ow input,.ow select,.ow textarea{display:block;width:100%;box-sizing:border-box;margin-top:.4rem;padding:.75rem .85rem;border:1px solid currentColor;border-radius:6px;background:transparent;color:inherit;font:inherit;font-weight:400;opacity:.9}.ow select option{color:#111}.ow button{margin-top:.5rem;padding:.85rem 1.8rem;border:0;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;background:currentColor}.ow button span{filter:invert(1)}.ow .hp{position:absolute;left:-9999px}.ow a{color:inherit}#thanks{display:none;padding:1.5rem;border:1px solid currentColor;border-radius:8px;margin-bottom:2rem}#thanks:target{display:block}#thanks:target+form{display:none}.ow-foot{text-align:center;padding:2rem 1rem;opacity:.75;font-size:.9rem}</style></head>
<body style="background:var(--ivory);color:var(--ink)"><main class="ow"><p><a href="../">← Back to Zafe Chokola</a></p><h1>Order a website</h1>
<p class="lede">Like this site? Website design by Sherwinn E Brice. Tell me about your project and I’ll get back to you to talk next steps.</p>
<div id="thanks" role="status"><h2>Thank you!</h2><p>Your request has been received. Sherwinn will be in touch soon.</p></div>
<form name="order-website" method="POST" action="https://formsubmit.co/dupesletsgo@gmail.com"><input type="hidden" name="_subject" value="New website order request (Zafe Chokola site)"><input type="hidden" name="_template" value="table"><input type="hidden" name="_next" value="https://dupesdidit.github.io/zafe-chokola/order-website/#thanks"><input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off">
<label>Name *<input type="text" name="name" required></label><label>Email *<input type="email" name="email" required></label><label>Phone (optional)<input type="tel" name="phone"></label><label>Business / project name *<input type="text" name="business" required></label>
<label>What is the site for? *<textarea name="purpose" rows="4" required></textarea></label><label>Pages / features needed *<textarea name="pages_features" rows="4" required></textarea></label>
<label>Budget range *<select name="budget" required><option value="">Choose…</option><option>Under $500</option><option>$500–$1,000</option><option>$1,000–$2,500</option><option>$2,500–$5,000</option><option>$5,000+</option><option>Not sure yet</option></select></label>
<label>Deadline *<input type="date" name="deadline" required></label><label>Anything else? (optional)<textarea name="other" rows="4"></textarea></label><button type="submit"><span>Send request</span></button></form></main>
<footer class="ow-foot"><a href="./">Website designed by Sherwinn E Brice</a></footer></body></html>
